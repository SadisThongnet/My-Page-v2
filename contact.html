<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h2>Contact Me</h2>
    <p>หากมีข้อเสนอแนะหรือต้องการติดต่อร่วมงาน สามารถกรอกข้อมูลผ่านแบบฟอร์มด้านล่างได้ครับ</p>

    <!-- ฟอร์มการติดต่อ -->
    <form action="#" method="POST" class="contact-form">
      <div class="form-group">
        <label for="name">ชื่อผู้ติดต่อ (Name):</label>
        <input type="text" id="name" name="name" placeholder="กรุณากรอกชื่อของคุณ" required>
      </div>

      <div class="form-group">
        <label for="email">อีเมล (Email):</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="subject">หัวข้อ (Subject):</label>
        <input type="text" id="subject" name="subject" placeholder="หัวข้อการติดต่อ" required>
      </div>

      <div class="form-group">
        <label for="message">ข้อความ (Message):</label>
        <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความที่ต้องการติดต่อที่นี่..." required></textarea>
      </div>

      <div>
        <button type="submit" class="btn-primary">ส่งข้อความ</button>
        <a href="index.html" class="btn-primary" style="background-color: #6c757d; margin-left: 8px;">กลับสู่หน้าหลัก</a>
      </div>
    </form>

    <!-- Footer -->
    <footer>
      <p>© 2026 My Portfolio v2. </p>
      <p>
        <a href="https://github.com/SadisThongnet" target="_blank">My GitHub</a> |
        <a href="index.html">หน้าแรก (Home)</a>
      </p>
    </footer>
  </div>

</body>
</html>
